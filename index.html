<!DOCTYPE html>
<html lang="fr" class="dark transition-colors duration-500">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LevelMak Pro</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <script>
        // Unregister stale service workers in local dev environment
        if ('serviceWorker' in navigator && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
                for (let registration of registrations) {
                    registration.unregister();
                }
            });
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                        display: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            DEFAULT: '#3B82F6',
                            dark: '#2563EB',
                            light: '#60A5FA',
                        },
                        secondary: {
                            DEFAULT: '#8B5CF6',
                            dark: '#7C3AED',
                            light: '#A78BFA',
                        },
                        accent: '#F59E0B',
                        success: '#10B981',
                        danger: '#EF4444',
                        background: 'var(--background)',
                        card: 'var(--card)',
                        surface: 'var(--surface)',
                    },
                    boxShadow: {
                        'premium': '0 20px 50px -12px rgba(0, 0, 0, 0.5)',
                        'premium-light': '0 10px 30px -10px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 20px rgba(59, 130, 246, 0.3)',
                    },
                    backgroundImage: {
                        'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))',
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --background: #f4f6fb;  /* Luxury soft slate-cream background (no harsh white glare) */
            --card: #ffffff;        /* Pure crisp card surface */
            --surface: #e2e8f0;    /* Soft Slate 200 */
            --text-main: #0f172a;  /* Deep Slate 900 for high readability */
            --base-font-size: 16px;
        }

        .dark {
            --background: #050b18; /* Deep Midnight Blue */
            --card: #0a1229;       /* Rich Navy Blue */
            --surface: #111e3b;    /* Slightly lighter Navy */
            --text-main: #f8fafc;
        }

        /* Classe Glassmorphism épurée et lisible */
        .glass {
            background: rgba(255, 255, 255, 0.85); /* Clean frosted glass in light mode */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.04);
        }

        .dark .glass {
            background: rgba(10, 18, 41, 0.75); /* Match with dark --card */
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Root font sizing for Tailwind scalability */
        html {
            font-size: var(--base-font-size) !important;
        }

        .font-size-xs {
            --base-font-size: 14px;
        }

        .font-size-sm {
            --base-font-size: 15px;
        }

        .font-size-base {
            --base-font-size: 16px;
        }

        .font-size-lg {
            --base-font-size: 18px;
        }

        .font-size-xl {
            --base-font-size: 20px;
        }

        /* Force hide scrollbars and overflow globally, manage safe areas */
        html,
        body {
            overflow: hidden !important;
            height: 100% !important;
            width: 100% !important;
            margin: 0 !important;
            background-color: var(--background);
            transition: background-color 0.5s ease;
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        /* Accessibility: Support prefers-reduced-motion (WCAG 2.3.3) */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* Target all elements for scrollbar removal */
        * {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        .no-scrollbar {
            -ms-overflow-style: none !important;
            scrollbar-width: none !important;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }

        #root {
            height: 100% !important;
            width: 100% !important;
            overflow-y: auto !important;
            -webkit-overflow-scrolling: touch;
        }

        /* Custom Premium Scrollbar for specific sections */
        .custom-scrollbar {
            scrollbar-width: thin !important;
            scrollbar-color: rgba(148, 163, 184, 0.2) transparent !important;
        }

        .custom-scrollbar::-webkit-scrollbar {
            display: block !important;
            width: 5px !important;
            height: 5px !important;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent !important;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.2) !important;
            border-radius: 20px !important;
            transition: background 0.3s ease;
        }

        .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.4) !important;
        }

        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1) !important;
        }

        .dark .custom-scrollbar:hover::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2) !important;
        }

        /* Leaflet Premium Labels */
        .premium-label {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
        }

        .premium-label::before {
            display: none !important;
        }

        /* Shrink Leaflet Popups */
        .leaflet-popup-content-wrapper {
            padding: 0 !important;
            border-radius: 12px !important;
        }

        .leaflet-popup-content {
            margin: 6px !important;
            width: auto !important;
        }

        .leaflet-popup-close-button {
            padding: 4px !important;
            color: #94a3b8 !important;
        }

        /* Overrides for clean, high-fidelity PDF-like document printing */
        @media print {
            html, body, #root, main, .overflow-y-auto {
                overflow: visible !important;
                height: auto !important;
                min-height: auto !important;
                max-height: none !important;
                background: white !important;
                color: #0f172a !important;
                -ms-overflow-style: auto !important;
                scrollbar-width: auto !important;
            }

            *::-webkit-scrollbar, * {
                scrollbar-width: auto !important;
            }

            body > div:first-child,
            .fixed.inset-0.overflow-hidden {
                display: none !important;
            }

            aside, 
            header,
            .sticky, 
            button, 
            .flex.gap-2.bg-black\/20, 
            .flex-col.md\:flex-row.gap-4.bg-white\/5, 
            .flex-col.md\:flex-row.gap-6.bg-white\/5, 
            .grid.grid-cols-1.md\:grid-cols-3.gap-4, 
            th:last-child, td:last-child, 
            .print\:hidden {
                display: none !important;
            }

            .hidden.print\:flex {
                display: flex !important;
                color: #0f172a !important;
                border-bottom: 2px solid #3b82f6 !important;
                padding-bottom: 15px !important;
                margin-bottom: 30px !important;
                align-items: center !important;
                gap: 24px !important;
            }
            .hidden.print\:flex h1 {
                color: #1e293b !important;
                font-size: 24px !important;
                margin: 0 !important;
            }
            .hidden.print\:flex p {
                color: #64748b !important;
                margin: 2px 0 0 0 !important;
            }

            table {
                width: 100% !important;
                border-collapse: collapse !important;
                background: white !important;
                color: #1e293b !important;
                font-size: 11px !important;
                margin-top: 20px !important;
            }
            tr {
                background: transparent !important;
            }
            thead tr {
                background-color: #3b82f6 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            th {
                background-color: #3b82f6 !important;
                color: white !important;
                font-weight: 700 !important;
                font-size: 11px !important;
                padding: 10px 8px !important;
                border: none !important;
                text-align: left !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            td {
                color: #334155 !important;
                padding: 10px 8px !important;
                border-bottom: 1px solid #e2e8f0 !important;
                background: transparent !important;
                word-break: break-word !important;
            }
            tbody tr:nth-child(even) {
                background-color: #f8fafc !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            
            table *, td *, td p, td span {
                color: #1e293b !important;
            }
            td .text-slate-500 {
                color: #64748b !important;
            }
            .w-24.h-1.bg-white\/10 {
                display: none !important;
            }
            td span.px-3.py-1.rounded-full {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
                font-weight: bold !important;
            }
            
            .bg-black\/40.backdrop-blur-md,
            .bg-white\/5.backdrop-blur-xl {
                background: transparent !important;
                border: none !important;
                box-shadow: none !important;
            }

            .custom-scrollbar > div {
                background: transparent !important;
                border-bottom: 1px solid #e2e8f0 !important;
                padding: 10px 0 !important;
                color: #1e293b !important;
            }
            .custom-scrollbar > div * {
                color: #1e293b !important;
            }
            .p-2.rounded-lg {
                background: transparent !important;
                border: none !important;
                padding: 0 !important;
            }

            /* Override Recharts SVG text elements on print to be dark */
            .recharts-text, 
            .recharts-legend-item-text,
            .recharts-default-tooltip,
            .recharts-tooltip-item,
            text,
            tspan {
                fill: #1e293b !important;
                color: #1e293b !important;
            }
        }
        /* ✅ Accessibility: WCAG 2.3.3 — Respect system preference for reduced motion.
           Disables animations and transitions for users who have enabled
           "Reduce Motion" in their OS/browser accessibility settings.           */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }

            /* Keep background blobs static */
            .animate-pulse,
            .animate-bounce,
            .animate-spin,
            .animate-ping {
                animation: none !important;
            }
            /* Viewport and dynamic height stability */
            html, body, #root {
                min-height: 100vh;
                min-height: 100dvh;
                width: 100%;
                overscroll-behavior-y: none;
            }
        }
    </style>
</head>


<body class="bg-background text-slate-100 min-h-[100vh] min-h-[100dvh] selection:bg-primary/30 selection:text-white overflow-x-hidden">
    <!-- Decorative Background Elements -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none -z-10">
        <div
            class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/20 rounded-full blur-[120px] animate-pulse">
        </div>
        <div class="absolute top-[20%] -right-[5%] w-[35%] h-[35%] bg-secondary/20 rounded-full blur-[100px] animate-bounce"
            style="animation-duration: 10s"></div>
        <div class="absolute -bottom-[10%] left-[20%] w-[30%] h-[30%] bg-accent/10 rounded-full blur-[80px]"></div>
        <div
            class="absolute inset-0 bg-[url('data:image/svg+xml,%3Csvg%20viewBox=%220%200%20200%20200%22%20xmlns=%22http://www.w3.org/2000/svg%22%3E%3Cfilter%20id=%22noiseFilter%22%3E%3CfeTurbulence%20type=%22fractalNoise%22%20baseFrequency=%220.65%22%20numOctaves=%223%22%20stitchTiles=%22stitch%22/%3E%3C/filter%3E%3Crect%20width=%22100%25%22%20height=%22100%25%22%20filter=%22url(%23noiseFilter)%22/%3E%3C/svg%3E')] opacity-20 mix-blend-overlay">
        </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
